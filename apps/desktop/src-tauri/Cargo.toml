[package]
name = "monument"
version = "0.2.0-alpha.5"
description = "Product-first Codex development workspace"
authors = ["Monument contributors"]
edition = "2021"

[lib]
name = "monument_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
wait-timeout = "0.2"
ignore = "0.4"
