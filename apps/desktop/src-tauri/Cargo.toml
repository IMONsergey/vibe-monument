[package]
name = "monument"
version = "0.1.0"
description = "Codex-native product development workspace"
authors = ["Monument contributors"]
edition = "2021"

[lib]
name = "monument_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
