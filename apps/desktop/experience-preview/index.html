<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="description"
      content="Interactive Monument Product Experience Refoundation concept preview"
    />
    <title>Monument — Contextual Orbit preview</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <style>
        body { margin: 0; background: #f5f5f3; color: #171717; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
        .nojs-workspace { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
        .nojs-bar, .nojs-composer { margin: 12px; padding: 14px 18px; border: 1px solid #d8d8d4; border-radius: 16px; background: #fff; }
        .nojs-canvas { margin: 0 12px; display: grid; place-items: center; border: 1px solid #d8d8d4; border-radius: 18px; background: #f2eee3; }
        .nojs-product { max-width: 680px; padding: 48px; }
        .nojs-product h1 { max-width: 560px; margin: 10px 0 18px; font: 500 clamp(42px, 7vw, 76px)/.96 Georgia, serif; letter-spacing: -.045em; }
        .nojs-label { color: #075a9c; font-size: 12px; font-weight: 700; }
      </style>
      <main class="nojs-workspace" aria-label="Monument concept preview without JavaScript">
        <header class="nojs-bar"><strong>Monument</strong> · Aster / Home · <span class="nojs-label">Simulated concept</span></header>
        <section class="nojs-canvas" aria-label="Readable sample product canvas">
          <article class="nojs-product">
            <small>EDITION 06 · QUIET UTILITY</small>
            <h1>Objects for a slower home.</h1>
            <p>A seasonal study of tools, vessels, and small rituals made to improve with use.</p>
          </article>
        </section>
        <footer class="nojs-composer">Interactive selection, contextual tools, and simulated Codex states require JavaScript. The product composition remains readable.</footer>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
