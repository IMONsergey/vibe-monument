name: Monument Desktop CI

on:
  push:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/monument-desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/monument-desktop.yml'

permissions:
  contents: read

jobs:
  web-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and native source contract
        run: npm run check
      - name: Protocol regression tests
        run: npm test
      - name: Production web build
        run: npm run build

  native-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test native Tauri host
        run: cargo test --all-targets
