name: Monument Desktop CI

on:
  push:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/monument-desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/monument-desktop.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Protocol and unit tests
        run: npm test
      - name: Static build
        run: npm run build
