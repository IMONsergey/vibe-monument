name: Monument Intel Alpha Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/package.json'
      - 'apps/desktop/src/version.ts'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - '.github/workflows/monument-intel-alpha-release.yml'
  workflow_dispatch:

concurrency:
  group: monument-intel-alpha-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-intel-dmg:
    name: Intel x86_64 DMG
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: apps/desktop
    env:
      APPLE_SIGNING_IDENTITY: '-'
      MONUMENT_VERSION: '0.2.0-alpha.6'
      RELEASE_TAG: 'monument-v0.2.0-alpha.6-intel'
      RELEASE_ASSET: 'Monument-0.2.0-alpha.6-Intel-x86_64.dmg'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Install Rust stable for Intel
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin

      - name: Guard immutable release identity
        run: |
          echo identity > /tmp/monument-release-stage
          git fetch --tags --force
          if git rev-parse "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "Release tag $RELEASE_TAG already points to $EXISTING_SHA; current commit is $GITHUB_SHA. Bump Monument version instead of replacing an existing release." >&2
              exit 1
            fi
          fi

      - name: Validate production contracts
        run: |
          echo validate > /tmp/monument-release-stage
          npm run check
          npm test
          npm run build
          cd src-tauri
          cargo test --all-targets

      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli@latest

      - name: Generate complete macOS icon set
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Intel DMG explicitly
        run: |
          echo build > /tmp/monument-release-stage
          npx tauri build --target x86_64-apple-darwin --bundles dmg
          DMG="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print | head -n 1)"
          test -n "$DMG"
          cp "$DMG" "$GITHUB_WORKSPACE/$RELEASE_ASSET"
          shasum -a 256 "$GITHUB_WORKSPACE/$RELEASE_ASSET" > "$GITHUB_WORKSPACE/$RELEASE_ASSET.sha256"
          test -s "$GITHUB_WORKSPACE/$RELEASE_ASSET"

      - name: Smoke-test packaged Intel application
        run: |
          echo smoke > /tmp/monument-release-stage
          ASSET="$GITHUB_WORKSPACE/$RELEASE_ASSET"
          MOUNT="/tmp/monument-dmg-$GITHUB_RUN_ID"
          mkdir -p "$MOUNT"
          cleanup() { hdiutil detach "$MOUNT" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          hdiutil attach "$ASSET" -nobrowse -readonly -mountpoint "$MOUNT"
          APP="$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' -print | head -n 1)"
          test -n "$APP"
          EXECUTABLE="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -print | head -n 1)"
          test -n "$EXECUTABLE"
          file "$EXECUTABLE"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | tr ' ' '\n' | grep -qx 'x86_64'
          codesign --verify --deep "$APP"
          plutil -lint "$APP/Contents/Info.plist"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo publish > /tmp/monument-release-stage
          cat > /tmp/monument-release-notes.md <<'EOF'
          Monument 0.2.0 Alpha 6 — Queue + Repair — Intel Mac

          Product-first Codex workspace for Intel Macs with reversible version history, evidence-aware repair and a persistent Lovable-style prompt queue.

          Core workflow:
          - open a real local project and run its actual dev server inside Monument;
          - work with real Codex threads, streaming turns, interrupt, approvals and inline questions;
          - Select (`I`) any element in the live product and attach real DOM/accessibility/style/source context to the next prompt;
          - run deterministic Auto-QA plus privacy-bounded Browser Evidence from the real preview;
          - use Version Timeline to move back/forward, restore checkpoints, compare versions and branch alternatives;
          - quality badges are bound to the exact Timeline generation they verified;
          - failed evidence can be sent back with one-click Fix with Monument;
          - optional bounded Auto Repair stops after two attempts or repeated failures and keeps normal Codex approvals;
          - queue up to 20 prompts while Codex works; queue state persists locally, preserves captured Select context and respects failed-evidence blocking.

          Safety / trust:
          - automatic project checks remain off until explicitly enabled per project;
          - repair never gets permission to weaken tests or bypass verification merely to become green;
          - Timeline storage is isolated from the user's visible Git index/history and never uses destructive `git reset --hard` on the project;
          - restore paths are preflighted against symlink escape and unmanaged source conflicts.

          Requirements:
          - Intel Mac (x86_64, including Intel Core i9);
          - macOS 13 or newer;
          - OpenAI Codex CLI installed and available to the desktop app.

          This alpha is ad-hoc signed and not notarized yet. macOS may require allowing Monument in System Settings → Privacy & Security on first launch.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/$RELEASE_ASSET" "$GITHUB_WORKSPACE/$RELEASE_ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title 'Monument 0.2.0 Alpha 6 — Queue + Repair — Intel Mac' --notes-file /tmp/monument-release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$GITHUB_WORKSPACE/$RELEASE_ASSET" "$GITHUB_WORKSPACE/$RELEASE_ASSET.sha256" --target "$GITHUB_SHA" --title 'Monument 0.2.0 Alpha 6 — Queue + Repair — Intel Mac' --notes-file /tmp/monument-release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url > /tmp/monument-release-url

      - name: Prepare successful release marker
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          asset = Path(os.environ['GITHUB_WORKSPACE']) / os.environ['RELEASE_ASSET']
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          release_url = Path('/tmp/monument-release-url').read_text().strip()
          Path('/tmp/monument-intel-alpha.json').write_text(json.dumps({
              'status': 'published',
              'version': os.environ['MONUMENT_VERSION'],
              'architecture': 'x86_64-apple-darwin',
              'runner': 'macos-15-intel',
              'minimum_macos': '13.0',
              'release_url': release_url,
              'asset_name': os.environ['RELEASE_ASSET'],
              'sha256': digest,
              'signing': 'ad-hoc',
              'notarized': False,
              'verified_dmg_mount': True,
              'verified_binary_architecture': 'x86_64'
          }, indent=2) + '\n')
          PY

      - name: Prepare failed release marker
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          stage_file = Path('/tmp/monument-release-stage')
          stage = stage_file.read_text().strip() if stage_file.exists() else 'setup'
          Path('/tmp/monument-intel-alpha.json').write_text(json.dumps({
              'status': 'failed',
              'version': os.environ['MONUMENT_VERSION'],
              'architecture': 'x86_64-apple-darwin',
              'runner': 'macos-15-intel',
              'failed_stage': stage
          }, indent=2) + '\n')
          PY

      - name: Persist release marker to main
        if: always()
        run: |
          test -f /tmp/monument-intel-alpha.json || exit 0
          cd ../..
          git fetch origin main
          git checkout -B release-marker origin/main
          mkdir -p builds
          cp /tmp/monument-intel-alpha.json builds/monument-intel-alpha.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/monument-intel-alpha.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record Intel alpha release status'
          git push origin HEAD:main
