name: Monument Intel Alpha Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/monument-intel-alpha-release.yml'
  workflow_dispatch:

concurrency:
  group: monument-intel-alpha-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-intel-dmg:
    name: Intel x86_64 DMG
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: apps/desktop
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Install Rust stable for Intel
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin

      - name: Validate production contracts
        run: |
          npm run check
          npm test
          npm run build
          cd src-tauri
          cargo test --all-targets

      - name: Install prebuilt Tauri CLI
        run: npm install --no-save @tauri-apps/cli@latest

      - name: Generate complete macOS icon set
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build and publish Intel DMG
        id: publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          tagName: monument-v0.2.0-alpha.2-intel
          releaseName: 'Monument 0.2.0 Alpha 2 — Protocol Gate — Intel Mac'
          releaseBody: |
            Product-first Monument alpha with the Codex protocol safety gate closed.

            Included:
            - real local project inspection and managed live preview runtime
            - real Codex task/thread projection and streaming turns
            - current Codex turn input contract
            - command, file-change and granular permission approvals
            - inline Codex questions / request_user_input
            - active turn interruption
            - bounded retry for app-server saturation
            - Codex-managed ChatGPT sign-in recovery
            - actual Codex binary/version diagnostics
            - installed-binary protocol schema generation/compatibility probe
            - local SQLite state and progressive-disclosure engineering surfaces
            - CI invariants preventing production mocks and protocol regressions

            Requirements:
            - Intel Mac (x86_64, including Core i9)
            - macOS 13 or newer
            - OpenAI Codex CLI installed

            Next major product gate:
            - direct Select/Inspect on the live preview
            - source/context attachment to Codex
            - deterministic browser/evidence/review/repair gates

            This alpha uses ad-hoc signing and is not notarized yet. macOS may require allowing Monument in System Settings → Privacy & Security on first launch.
          releaseCommitish: main
          prerelease: true
          releaseDraft: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'Monument-Intel-x86_64-DMG'
          releaseAssetNamePattern: 'Monument-[version]-Intel-x86_64.[ext]'
          args: '--target x86_64-apple-darwin --bundles dmg'

      - name: Prepare successful release marker
        if: success()
        env:
          RELEASE_URL: ${{ steps.publish.outputs.releaseHtmlUrl }}
          ARTIFACT_PATHS: ${{ steps.publish.outputs.artifactPaths }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('/tmp/monument-intel-alpha.json').write_text(json.dumps({
              'status': 'published',
              'version': '0.2.0-alpha.2',
              'architecture': 'x86_64-apple-darwin',
              'runner': 'macos-15-intel',
              'minimum_macos': '13.0',
              'release_url': os.environ.get('RELEASE_URL', ''),
              'asset_name': 'Monument-0.2.0-alpha.2-Intel-x86_64.dmg',
              'artifact_paths': os.environ.get('ARTIFACT_PATHS', ''),
              'signing': 'ad-hoc',
              'notarized': False
          }, indent=2) + '\n')
          PY

      - name: Prepare failed release marker
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/monument-intel-alpha.json').write_text(json.dumps({
              'status': 'failed',
              'version': '0.2.0-alpha.2',
              'architecture': 'x86_64-apple-darwin',
              'runner': 'macos-15-intel'
          }, indent=2) + '\n')
          PY

      - name: Persist release marker to main
        if: always()
        run: |
          test -f /tmp/monument-intel-alpha.json || exit 0
          cd ../..
          git fetch origin main
          git checkout -B release-marker origin/main
          mkdir -p builds
          cp /tmp/monument-intel-alpha.json builds/monument-intel-alpha.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/monument-intel-alpha.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record Intel alpha release status'
          git push origin HEAD:main
