name: Monument Intel Alpha Release

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/monument-intel-alpha-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'builds/trigger-intel-alpha.txt'
  workflow_dispatch:

concurrency:
  group: monument-intel-alpha-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-intel-dmg:
    if: github.event_name != 'pull_request' || github.head_ref == 'release/trigger-intel-alpha'
    name: Intel x86_64 DMG
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: apps/desktop
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable for Intel
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin

      - name: Validate web and Codex contracts
        run: |
          npm run check
          npm test
          npm run build

      - name: Install prebuilt Tauri CLI
        run: npm install --no-save @tauri-apps/cli@latest

      - name: Generate complete macOS icon set
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build and publish Intel DMG
        id: publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          tagName: monument-v0.1.0-alpha.1-intel
          releaseName: 'Monument 0.1.0 Alpha 1 — Intel Mac'
          releaseBody: |
            First installable Monument alpha for Intel Macs (x86_64).

            Requirements:
            - Intel Mac (including Core i9)
            - macOS 13 or newer
            - OpenAI Codex CLI installed and authenticated

            This alpha uses ad-hoc signing and is not notarized yet. macOS may require allowing Monument in System Settings → Privacy & Security on first launch.
          releaseCommitish: main
          prerelease: true
          releaseDraft: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'Monument-Intel-x86_64-DMG'
          releaseAssetNamePattern: 'Monument-[version]-Intel-x86_64.[ext]'
          args: '--target x86_64-apple-darwin --bundles dmg'

      - name: Prepare successful release marker
        if: success()
        env:
          RELEASE_URL: ${{ steps.publish.outputs.releaseHtmlUrl }}
          ARTIFACT_PATHS: ${{ steps.publish.outputs.artifactPaths }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('/tmp/monument-intel-alpha.json').write_text(json.dumps({
              'status': 'published',
              'version': '0.1.0-alpha.1',
              'architecture': 'x86_64-apple-darwin',
              'runner': 'macos-15-intel',
              'minimum_macos': '13.0',
              'release_url': os.environ.get('RELEASE_URL', ''),
              'asset_name': 'Monument-0.1.0-Intel-x86_64.dmg',
              'artifact_paths': os.environ.get('ARTIFACT_PATHS', ''),
              'signing': 'ad-hoc',
              'notarized': False
          }, indent=2) + '\n')
          PY

      - name: Prepare failed release marker
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/monument-intel-alpha.json').write_text(json.dumps({
              'status': 'failed',
              'version': '0.1.0-alpha.1',
              'architecture': 'x86_64-apple-darwin',
              'runner': 'macos-15-intel'
          }, indent=2) + '\n')
          PY

      - name: Persist release marker to main
        if: always()
        run: |
          test -f /tmp/monument-intel-alpha.json || exit 0
          cd ../..
          git fetch origin main
          git checkout -B release-marker origin/main
          mkdir -p builds
          cp /tmp/monument-intel-alpha.json builds/monument-intel-alpha.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/monument-intel-alpha.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record Intel alpha release status'
          git push origin HEAD:main
