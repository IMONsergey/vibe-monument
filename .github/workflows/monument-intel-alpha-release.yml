name: Monument Intel Alpha Preview

on:
  push:
    branches: [monument/alpha-preview-intel]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/monument-intel-alpha-release.yml'
  pull_request:
    branches: [monument/visual-editor-m2-component-content]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/monument-intel-alpha-release.yml'
  workflow_dispatch:

concurrency:
  group: monument-intel-alpha-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MONUMENT_VERSION: '0.2.0-alpha.10'
  RELEASE_TAG: 'monument-v0.2.0-alpha.10-intel'
  RELEASE_ASSET: 'Monument-0.2.0-alpha.10-Intel-x86_64.dmg'

jobs:
  build-intel-dmg:
    if: github.event_name != 'push'
    name: Intel x86_64 DMG
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: apps/desktop
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Install Rust stable for Intel
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin
          rustc -Vv

      - name: Install temporary application icon
        run: npm run prepare:icon

      - name: Validate product contracts and regressions
        run: |
          npm run check
          npm test
          npm run build
          cd src-tauri
          cargo test --all-targets

      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli@latest

      - name: Generate complete macOS icon set
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Intel DMG
        run: |
          set -o pipefail
          npx tauri build --target x86_64-apple-darwin --bundles dmg 2>&1 | tee /tmp/monument-build.log
          DMG="$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print | head -n 1)"
          test -n "$DMG"
          cp "$DMG" "$GITHUB_WORKSPACE/$RELEASE_ASSET"
          shasum -a 256 "$GITHUB_WORKSPACE/$RELEASE_ASSET" | tee "$GITHUB_WORKSPACE/$RELEASE_ASSET.sha256"
          test -s "$GITHUB_WORKSPACE/$RELEASE_ASSET"

      - name: Smoke-test packaged Intel application
        run: |
          ASSET="$GITHUB_WORKSPACE/$RELEASE_ASSET"
          MOUNT="/tmp/monument-dmg-$GITHUB_RUN_ID"
          mkdir -p "$MOUNT"
          cleanup() { hdiutil detach "$MOUNT" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          hdiutil attach "$ASSET" -nobrowse -readonly -mountpoint "$MOUNT"
          APP="$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' -print | head -n 1)"
          test -n "$APP"
          EXECUTABLE="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -print | head -n 1)"
          test -n "$EXECUTABLE"
          file "$EXECUTABLE"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | tr ' ' '\n' | grep -qx 'x86_64'
          codesign --verify --deep "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(defaults read "$APP/Contents/Info" CFBundleShortVersionString)" = "$MONUMENT_VERSION"

      - name: Upload verified DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monument-${{ env.MONUMENT_VERSION }}-Intel-x86_64
          path: |
            ${{ github.workspace }}/${{ env.RELEASE_ASSET }}
            ${{ github.workspace }}/${{ env.RELEASE_ASSET }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Guard immutable release identity
        if: github.event_name != 'pull_request'
        run: |
          git fetch --tags --force
          if git rev-parse "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "Release tag $RELEASE_TAG already belongs to $EXISTING_SHA; bump the preview version." >&2
              exit 1
            fi
          fi

      - name: Publish GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/monument-release-notes.md <<'EOF'
          Monument 0.2.0 Alpha 10 — Intel Preview

          A large current-state preview of Monument for Intel Macs.

          Included in this build:
          - product-first Codex workspace with real project/runtime flow;
          - Version Timeline, deterministic checks, Browser Evidence, Fresh Review and Ship Gate;
          - Visual Editor with live Layers ↔ canvas selection and computed Properties;
          - deterministic literal CSS source transactions;
          - token-aware CSS editing with explicit instance/local/global scope and blast-radius evidence;
          - hardened static Tailwind + JSX inline-style ownership with cascade and conflict guards;
          - source-native static JSX text and semantic content batch editing (`aria-label`, `title`, `alt`, `placeholder`);
          - Codex fallback for every dynamic/ambiguous/unsupported source case;
          - temporary user-provided purple/blue four-disc application icon;
          - tightened alpha-preview startup/build diagnostics and production contracts.

          Safety model:
          - repository source remains authoritative;
          - remote preview is bounded data-only and has no source-write authority;
          - deterministic writes re-prove source ownership natively before atomic mutation;
          - direct edits enter the same Timeline → checks → Browser Evidence → Fresh Review → Ship chain.

          Requirements:
          - Intel Mac, x86_64 (including Intel Core i9);
          - macOS 13 or newer;
          - OpenAI Codex CLI installed and available to Monument.

          This preview is ad-hoc signed and not notarized. On first launch macOS may require allowing Monument in System Settings → Privacy & Security.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/$RELEASE_ASSET" "$GITHUB_WORKSPACE/$RELEASE_ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title 'Monument 0.2.0 Alpha 10 — Intel Preview' --notes-file /tmp/monument-release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$GITHUB_WORKSPACE/$RELEASE_ASSET" "$GITHUB_WORKSPACE/$RELEASE_ASSET.sha256" --target "$GITHUB_SHA" --title 'Monument 0.2.0 Alpha 10 — Intel Preview' --notes-file /tmp/monument-release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi

      - name: Persist preview build marker
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          asset = Path(os.environ['GITHUB_WORKSPACE']) / os.environ['RELEASE_ASSET']
          marker = {
              'version': os.environ['MONUMENT_VERSION'],
              'architecture': 'x86_64-apple-darwin',
              'runner': 'macos-15-intel',
              'minimum_macos': '13.0',
              'event': os.environ.get('GITHUB_EVENT_NAME'),
              'commit': os.environ['GITHUB_SHA'],
              'asset_name': os.environ['RELEASE_ASSET'],
              'signing': 'ad-hoc',
              'notarized': False,
          }
          if asset.exists():
              marker['status'] = 'built'
              marker['sha256'] = hashlib.sha256(asset.read_bytes()).hexdigest()
              marker['verified_dmg_mount'] = True
              marker['verified_binary_architecture'] = 'x86_64'
          else:
              marker['status'] = 'failed'
              log = Path('/tmp/monument-build.log')
              if log.exists():
                  lines = [line[-800:] for line in log.read_text(errors='replace').splitlines() if line.strip()][-35:]
                  marker['failure_tail'] = '\n'.join(lines)[-6000:]
          out = Path('/tmp/monument-intel-alpha-preview.json')
          out.write_text(json.dumps(marker, indent=2) + '\n')
          PY

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Monument-${{ env.MONUMENT_VERSION }}-build-diagnostics-${{ github.event_name }}
          path: /tmp/monument-intel-alpha-preview.json
          if-no-files-found: error
          retention-days: 14
