name: VibeOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vibeos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run complete VibeOS self-check
        run: python scripts/check_all.py
