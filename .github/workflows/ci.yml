name: VibeOS CI

on:
  push:
  pull_request:

concurrency:
  group: vibeos-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run complete VibeOS self-check
        run: python scripts/check_all.py
