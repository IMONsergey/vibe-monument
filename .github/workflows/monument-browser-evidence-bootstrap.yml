name: Monument Browser Evidence Bootstrap

on:
  push:
    branches: [monument/browser-evidence]
    paths:
      - '.github/workflows/monument-browser-evidence-bootstrap.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monument/browser-evidence

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wire Browser Evidence into the production shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('apps/desktop')

          def read(rel):
              return (root / rel).read_text()

          def write(rel, text):
              (root / rel).write_text(text)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing integration anchor: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique integration anchor: {label} ({text.count(old)})')
              return text.replace(old, new, 1)

          # Native child preview: install and collect a bounded browser diagnostics snapshot.
          text = read('src-tauri/src/preview_runtime.rs')
          text = replace_once(
              text,
              'use serde::{Deserialize, Serialize};\n',
              'use crate::browser_evidence::{collect_script, parse_title_payload, BROWSER_EVIDENCE_SCRIPT};\nuse serde::{Deserialize, Serialize};\nuse std::sync::atomic::{AtomicU64, Ordering};\nuse std::time::{SystemTime, UNIX_EPOCH};\n',
              'preview evidence imports',
          )
          text = replace_once(
              text,
              'const SELECTION_PREFIX: &str = "__MONUMENT_SELECTION__:";\n',
              'const SELECTION_PREFIX: &str = "__MONUMENT_SELECTION__:";\nstatic BROWSER_EVIDENCE_COUNTER: AtomicU64 = AtomicU64::new(1);\n',
              'browser evidence counter',
          )
          text = replace_once(
              text,
              '.initialization_script(PREVIEW_INSPECTOR_SCRIPT)\n',
              '.initialization_script(format!("{PREVIEW_INSPECTOR_SCRIPT}\\n{BROWSER_EVIDENCE_SCRIPT}"))\n',
              'preview initialization scripts',
          )
          old_handler = '''.on_document_title_changed(move |_webview, title| {
            let Some(json) = title.strip_prefix(SELECTION_PREFIX) else { return; };
            match serde_json::from_str::<PreviewSelection>(json) {
                Ok(selection) => { let _ = event_app.emit("monument://preview-selection", selection); }
                Err(error) => { let _ = event_app.emit("monument://preview-error", format!("Invalid preview selection payload: {error}")); }
            }
        });'''
          new_handler = '''.on_document_title_changed(move |_webview, title| {
            if let Some(json) = title.strip_prefix(SELECTION_PREFIX) {
                match serde_json::from_str::<PreviewSelection>(json) {
                    Ok(selection) => { let _ = event_app.emit("monument://preview-selection", selection); }
                    Err(error) => { let _ = event_app.emit("monument://preview-error", format!("Invalid preview selection payload: {error}")); }
                }
                return;
            }
            match parse_title_payload(&title) {
                Ok(Some(snapshot)) => { let _ = event_app.emit("monument://preview-browser-evidence", snapshot); }
                Ok(None) => {}
                Err(error) => { let _ = event_app.emit("monument://preview-error", error); }
            }
        });'''
          text = replace_once(text, old_handler, new_handler, 'preview title event bridge')
          marker = '''#[tauri::command]
pub fn preview_reload(app: tauri::AppHandle) -> Result<(), String> {'''
          commands = '''#[tauri::command]
pub fn preview_install_browser_evidence(app: tauri::AppHandle) -> Result<(), String> {
    let webview = app.get_webview(PREVIEW_LABEL).ok_or_else(|| "Preview webview is not open".to_string())?;
    webview.eval(BROWSER_EVIDENCE_SCRIPT).map_err(|error| error.to_string())
}

#[tauri::command]
pub fn preview_collect_browser_evidence(app: tauri::AppHandle) -> Result<String, String> {
    let webview = app.get_webview(PREVIEW_LABEL).ok_or_else(|| "Preview webview is not open".to_string())?;
    let now = SystemTime::now().duration_since(UNIX_EPOCH).unwrap_or_default().as_millis();
    let counter = BROWSER_EVIDENCE_COUNTER.fetch_add(1, Ordering::Relaxed);
    let request_id = format!("browser-{now}-{counter}");
    webview.eval(collect_script(&request_id)?).map_err(|error| error.to_string())?;
    Ok(request_id)
}

#[tauri::command]
pub fn preview_clear_browser_evidence(app: tauri::AppHandle) -> Result<(), String> {
    let webview = app.get_webview(PREVIEW_LABEL).ok_or_else(|| "Preview webview is not open".to_string())?;
    webview
        .eval("window.__MONUMENT_BROWSER_EVIDENCE__ && window.__MONUMENT_BROWSER_EVIDENCE__.clear();")
        .map_err(|error| error.to_string())
}

'''
          text = replace_once(text, marker, commands + marker, 'browser evidence preview commands')
          write('src-tauri/src/preview_runtime.rs', text)

          # Register native browser evidence module/commands.
          text = read('src-tauri/src/lib.rs')
          text = replace_once(text, 'mod codex_runtime;\n', 'mod browser_evidence;\nmod codex_runtime;\n', 'browser evidence module')
          old_import = 'use preview_runtime::{preview_close, preview_open, preview_reload, preview_set_bounds, preview_set_inspect};'
          new_import = 'use preview_runtime::{preview_clear_browser_evidence, preview_close, preview_collect_browser_evidence, preview_install_browser_evidence, preview_open, preview_reload, preview_set_bounds, preview_set_inspect};'
          text = replace_once(text, old_import, new_import, 'preview evidence imports in lib')
          text = replace_once(
              text,
              '            preview_set_inspect,\n            preview_reload,\n',
              '            preview_set_inspect,\n            preview_install_browser_evidence,\n            preview_collect_browser_evidence,\n            preview_clear_browser_evidence,\n            preview_reload,\n',
              'preview evidence command registration',
          )
          write('src-tauri/src/lib.rs', text)

          # Turn serial is the code-state generation. Evidence from older generations is stale.
          text = read('src/codex/runtime.ts')
          text = replace_once(text, '  activeTurnId: string | null;\n  completionSerial: number;\n', '  activeTurnId: string | null;\n  turnSerial: number;\n  completionSerial: number;\n', 'runtime turn serial type')
          text = replace_once(text, "    activeTurnId: null,\n    completionSerial: 0,\n", "    activeTurnId: null,\n    turnSerial: 0,\n    completionSerial: 0,\n", 'runtime turn serial initial state')
          old_turn_started = "        this.patch({ state: 'busy', message: '', activeTurnId: objectId(params.turn) ?? this.snapshot.activeTurnId });"
          new_turn_started = "        this.patch({ state: 'busy', message: '', activeTurnId: objectId(params.turn) ?? this.snapshot.activeTurnId, turnSerial: this.snapshot.turnSerial + 1 });"
          text = replace_once(text, old_turn_started, new_turn_started, 'turn started generation')
          write('src/codex/runtime.ts', text)

          text = read('src/types.ts')
          text = replace_once(text, '  codexMessage: string;\n  completionSerial: number;\n', '  codexMessage: string;\n  turnSerial: number;\n  completionSerial: number;\n', 'workspace turn serial')
          write('src/types.ts', text)

          # Bind deterministic evidence to the exact turn generation that it verified.
          text = read('src/verification/controller.ts')
          text = replace_once(text, '  projectId: string;\n  trigger:', '  projectId: string;\n  turnSerial: number;\n  trigger:', 'verification turn serial field')
          text = replace_once(
              text,
              "function newEvidence(projectId: string, trigger: VerificationEvidence['trigger'], plan: VerificationPlanItem[]): VerificationEvidence {",
              "function newEvidence(projectId: string, trigger: VerificationEvidence['trigger'], plan: VerificationPlanItem[], turnSerial: number): VerificationEvidence {",
              'verification evidence constructor',
          )
          text = replace_once(text, '    projectId,\n    trigger,\n', '    projectId,\n    turnSerial,\n    trigger,\n', 'verification evidence constructor value')
          text = replace_once(text, '  includeManual = false,\n}: {', '  includeManual = false,\n  turnSerial = 0,\n}: {', 'verification run turn serial parameter')
          text = replace_once(text, '  includeManual?: boolean;\n}): Promise<VerificationEvidence>', '  includeManual?: boolean;\n  turnSerial?: number;\n}): Promise<VerificationEvidence>', 'verification run turn serial type')
          text = text.replace('newEvidence(projectId, trigger, [])', 'newEvidence(projectId, trigger, [], turnSerial)')
          text = text.replace('newEvidence(projectId, trigger, plan)', 'newEvidence(projectId, trigger, plan, turnSerial)')
          write('src/verification/controller.ts', text)

          # Browser record is tied to the same turn generation.
          text = read('src/browser/evidence.ts')
          text = text.replace('capturedForCompletionSerial', 'capturedForTurnSerial')
          text = text.replace('completionSerial: number', 'turnSerial: number')
          text = text.replace('capturedForTurnSerial: completionSerial', 'capturedForTurnSerial: turnSerial')
          write('src/browser/evidence.ts', text)

          # Evidence panel understands stale deterministic evidence and includes Browser Evidence separately.
          text = read('src/components/EvidencePanel.tsx')
          text = replace_once(text, "function statusLabel(progress: VerificationProgress | null): string {\n  if (!progress) return 'No evidence yet';", "function statusLabel(progress: VerificationProgress | null, stale: boolean): string {\n  if (!progress) return 'No evidence yet';\n  if (stale) return 'Previous checks stale';", 'stale evidence status')
          text = replace_once(text, '  onRunAll,\n}: {', '  onRunAll,\n  stale = false,\n}: {', 'EvidencePanel stale prop destructure')
          text = replace_once(text, '  onRunAll: () => void;\n}) {', '  onRunAll: () => void;\n  stale?: boolean;\n}) {', 'EvidencePanel stale prop type')
          text = replace_once(text, '<div className="evidence-panel">', '<div className={`evidence-panel ${stale ? \'stale\' : \'\'}`}>', 'EvidencePanel stale class')
          text = replace_once(text, '<strong>{statusLabel(progress)}</strong>', '<strong>{statusLabel(progress, stale)}</strong>', 'EvidencePanel stale label')
          text = replace_once(
              text,
              "      <div className=\"auto-checks-row\">",
              "      {stale && evidence ? <div className=\"evidence-stale\">These checks belong to an older turn. Run or wait for current verification before treating them as evidence.</div> : null}\n\n      <div className=\"auto-checks-row\">",
              'EvidencePanel stale warning',
          )
          write('src/components/EvidencePanel.tsx', text)

          # Main product orchestration: invalidate on turn start; collect browser evidence after completion.
          text = read('src/App.tsx')
          text = replace_once(text, "import { DiagnosticsPanel } from './components/DiagnosticsPanel';\n", "import { BrowserEvidencePanel } from './components/BrowserEvidencePanel';\nimport { DiagnosticsPanel } from './components/DiagnosticsPanel';\n", 'BrowserEvidencePanel import')
          text = replace_once(text, "import { compileTurnText } from './context/turn';\n", "import { compileTurnText } from './context/turn';\nimport {\n  captureBrowserEvidence,\n  clearBrowserEvidenceBuffer,\n  markBrowserEvidenceStale,\n  restoreBrowserEvidence,\n  subscribeBrowserEvidence,\n  type BrowserEvidenceRecord,\n} from './browser/evidence';\n", 'browser evidence store import')
          text = replace_once(text, "  codexMessage: '',\n  completionSerial: 0,\n", "  codexMessage: '',\n  turnSerial: 0,\n  completionSerial: 0,\n", 'workspace initial turn serial')
          text = replace_once(text, '  const [verificationProgress, setVerificationProgress] = useState<VerificationProgress | null>(null);\n  const [verificationBusy, setVerificationBusy] = useState(false);\n', '  const [verificationProgress, setVerificationProgress] = useState<VerificationProgress | null>(null);\n  const [verificationBusy, setVerificationBusy] = useState(false);\n  const [browserEvidence, setBrowserEvidence] = useState<BrowserEvidenceRecord | null>(null);\n  const [browserEvidenceBusy, setBrowserEvidenceBusy] = useState(false);\n')
          text = replace_once(text, '  const handledCompletionSerial = useRef(0);\n  const verificationProjectId = useRef<string | null>(null);\n', '  const handledCompletionSerial = useRef(0);\n  const handledTurnSerial = useRef(0);\n  const verificationProjectId = useRef<string | null>(null);\n')
          text = replace_once(text, '  useEffect(() => subscribePreviewSelection(setSelection), []);\n  useEffect(() => subscribeVerification(setVerificationProgress), []);\n', '  useEffect(() => subscribePreviewSelection(setSelection), []);\n  useEffect(() => subscribeVerification(setVerificationProgress), []);\n  useEffect(() => subscribeBrowserEvidence(setBrowserEvidence), []);\n')
          text = replace_once(text, '      codexMessage: snapshot.message,\n      completionSerial: snapshot.completionSerial,\n', '      codexMessage: snapshot.message,\n      turnSerial: snapshot.turnSerial,\n      completionSerial: snapshot.completionSerial,\n', 'workspace Codex serial projection')
          old_project_effect = '''    verificationProjectId.current = project.id;
    handledCompletionSerial.current = workspace.completionSerial;
    void restoreVerification(project.id);
    void isAutoVerificationEnabled(project.id).then(setAutoVerificationEnabledState);
  }, [project?.id]);'''
          new_project_effect = '''    verificationProjectId.current = project.id;
    handledCompletionSerial.current = workspace.completionSerial;
    handledTurnSerial.current = workspace.turnSerial;
    void restoreVerification(project.id);
    void restoreBrowserEvidence(project.id);
    void isAutoVerificationEnabled(project.id).then(setAutoVerificationEnabledState);
  }, [project?.id]);'''
          text = replace_once(text, old_project_effect, new_project_effect, 'project evidence restore')
          insertion_anchor = '''  useEffect(() => {
    if (!project || verificationProjectId.current !== project.id || verificationBusy) return;
    if (workspace.completionSerial <= handledCompletionSerial.current) return;'''
          turn_effect = '''  useEffect(() => {
    if (!project || workspace.turnSerial <= handledTurnSerial.current) return;
    handledTurnSerial.current = workspace.turnSerial;
    void markBrowserEvidenceStale(project.id);
    if (runtimeUrl) void clearBrowserEvidenceBuffer().catch(() => undefined);
  }, [project?.id, runtimeUrl, workspace.turnSerial]);

'''
          text = replace_once(text, insertion_anchor, turn_effect + insertion_anchor, 'turn-start evidence invalidation')
          text = replace_once(text, "          await runVerification({ projectId, projectRoot, trigger: 'codex-turn' });\n          await refreshProjectSnapshot(projectRoot, projectId);", "          await runVerification({ projectId, projectRoot, trigger: 'codex-turn', turnSerial: workspace.turnSerial });\n          await refreshProjectSnapshot(projectRoot, projectId);\n          if (runtimeUrl) {\n            await new Promise((resolve) => window.setTimeout(resolve, 650));\n            setBrowserEvidenceBusy(true);\n            try { await captureBrowserEvidence(projectId, workspace.turnSerial); } catch (_) {} finally { setBrowserEvidenceBusy(false); }\n          }", 'automatic browser evidence capture')
          text = replace_once(text, '  }, [project?.id, project?.rootPath, refreshProjectSnapshot, verificationBusy, workspace.completionSerial]);', '  }, [project?.id, project?.rootPath, refreshProjectSnapshot, runtimeUrl, verificationBusy, workspace.completionSerial, workspace.turnSerial]);', 'completion effect dependencies')
          text = text.replace("trigger: 'manual', includeManual: true });", "trigger: 'manual', includeManual: true, turnSerial: workspace.turnSerial });")
          text = text.replace("trigger: 'codex-turn' });\n      await refreshProjectSnapshot", "trigger: 'codex-turn', turnSerial: workspace.turnSerial });\n      await refreshProjectSnapshot")
          capture_callback_anchor = '''  const startSignIn = useCallback(async () => {'''
          capture_callback = '''  const captureBrowserNow = useCallback(async () => {
    if (!project || !runtimeUrl || browserEvidenceBusy) return;
    setBrowserEvidenceBusy(true);
    setDeveloperOpen(true);
    setDeveloperTab('evidence');
    try {
      await captureBrowserEvidence(project.id, workspace.turnSerial);
    } catch (error) {
      setNotice(error instanceof Error ? error.message : String(error));
    } finally {
      setBrowserEvidenceBusy(false);
    }
  }, [browserEvidenceBusy, project, runtimeUrl, workspace.turnSerial]);

'''
          text = replace_once(text, capture_callback_anchor, capture_callback + capture_callback_anchor, 'manual browser evidence callback')
          text = replace_once(text, '  const verificationStatus = verificationLabel(verificationProgress);\n', "  const deterministicEvidenceStale = Boolean(verificationProgress && (verificationProgress.evidence.turnSerial !== workspace.turnSerial || workspace.codexState === 'busy' || workspace.codexState === 'approval'));\n  const browserEvidenceStale = Boolean(browserEvidence && (browserEvidence.stale || browserEvidence.capturedForTurnSerial !== workspace.turnSerial || workspace.codexState === 'busy' || workspace.codexState === 'approval'));\n  const verificationStatus = deterministicEvidenceStale && verificationProgress ? 'Checks stale' : verificationLabel(verificationProgress);\n")
          old_evidence_render = "{developerTab === 'evidence' ? <EvidencePanel progress={verificationProgress} manualRunning={verificationBusy} autoEnabled={autoVerificationEnabled} onEnableAuto={() => void enableAutoChecks()} onDisableAuto={() => void disableAutoChecks()} onRunAll={() => void runAllChecks()} /> : null}"
          new_evidence_render = "{developerTab === 'evidence' ? <>\n                <EvidencePanel progress={verificationProgress} manualRunning={verificationBusy} autoEnabled={autoVerificationEnabled} stale={deterministicEvidenceStale} onEnableAuto={() => void enableAutoChecks()} onDisableAuto={() => void disableAutoChecks()} onRunAll={() => void runAllChecks()} />\n                <BrowserEvidencePanel record={browserEvidence ? { ...browserEvidence, stale: browserEvidenceStale } : null} running={browserEvidenceBusy} previewAvailable={Boolean(runtimeUrl)} onCapture={() => void captureBrowserNow()} />\n              </> : null}"
          text = replace_once(text, old_evidence_render, new_evidence_render, 'Browser Evidence panel wiring')
          write('src/App.tsx', text)

          # Browser Evidence styles.
          text = read('src/main.tsx')
          text = replace_once(text, "import './styles/evidence.css';\n", "import './styles/evidence.css';\nimport './styles/browser-evidence.css';\n", 'browser evidence styles import')
          write('src/main.tsx', text)

          text = read('src/styles/evidence.css')
          text += "\n.evidence-panel.stale .evidence-list { opacity: .58; }\n.evidence-stale { margin: 10px; padding: 8px 9px; border: 1px solid rgba(154,103,24,.14); border-radius: 8px; background: rgba(154,103,24,.05); color: #765d2b; font-size: 8.7px; line-height: 1.45; }\n"
          write('src/styles/evidence.css', text)

          # Alpha 4 and deliberate release trigger semantics.
          package = json.loads(read('package.json'))
          package['version'] = '0.2.0-alpha.4'
          write('package.json', json.dumps(package, indent=2) + '\n')

          text = read('src-tauri/Cargo.toml').replace('version = "0.2.0-alpha.3"', 'version = "0.2.0-alpha.4"', 1)
          write('src-tauri/Cargo.toml', text)
          conf = json.loads(read('src-tauri/tauri.conf.json'))
          conf['version'] = '0.2.0-alpha.4'
          write('src-tauri/tauri.conf.json', json.dumps(conf, indent=2) + '\n')
          write('src/version.ts', "export const MONUMENT_VERSION = '0.2.0-alpha.4';\n")

          workflow_path = Path('.github/workflows/monument-intel-alpha-release.yml')
          workflow = workflow_path.read_text()
          old_paths = '''    paths:
      - 'apps/desktop/**'
      - '.github/workflows/monument-intel-alpha-release.yml'\n'''
          new_paths = '''    paths:
      - 'apps/desktop/package.json'
      - 'apps/desktop/src/version.ts'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - '.github/workflows/monument-intel-alpha-release.yml'\n'''
          workflow = replace_once(workflow, old_paths, new_paths, 'deliberate release trigger paths')
          workflow = workflow.replace('0.2.0-alpha.3', '0.2.0-alpha.4')
          workflow = workflow.replace('Alpha 3 — Select / Inspect', 'Alpha 4 — Browser Evidence / Auto-QA')
          workflow = workflow.replace('Monument 0.2.0 Alpha 3 — Select / Inspect — Intel Mac', 'Monument 0.2.0 Alpha 4 — Browser Evidence / Auto-QA — Intel Mac')
          workflow = workflow.replace('- deterministic source hints ranked from the actual repository;\n', '- deterministic source hints ranked from the actual repository;\n          - trusted deterministic typecheck/test/build evidence with explicit per-project Auto-QA permission;\n          - bounded browser runtime/console/network evidence from the live preview;\n          - stale-evidence invalidation when newer Codex work starts;\n')
          workflow_path.write_text(workflow)

          # Extend source contract for Browser Evidence + stale semantics + selective release trigger.
          text = read('scripts/check_native_source.mjs')
          text = replace_once(text, "const sourceLocator = await readFile(join(root, 'src-tauri/src/source_locator.rs'), 'utf8');\n", "const sourceLocator = await readFile(join(root, 'src-tauri/src/source_locator.rs'), 'utf8');\nconst browserEvidenceRuntime = await readFile(join(root, 'src-tauri/src/browser_evidence.rs'), 'utf8');\n", 'source contract browser native read')
          text = replace_once(text, "const evidencePanel = await readFile(join(root, 'src/components/EvidencePanel.tsx'), 'utf8');\n", "const evidencePanel = await readFile(join(root, 'src/components/EvidencePanel.tsx'), 'utf8');\nconst browserEvidencePanel = await readFile(join(root, 'src/components/BrowserEvidencePanel.tsx'), 'utf8');\nconst browserEvidenceStore = await readFile(join(root, 'src/browser/evidence.ts'), 'utf8');\n", 'source contract browser frontend reads')
          text = replace_once(text, "const productionSource = `${entry}\\n${app}\\n${approval}\\n${diagnostics}\\n${evidencePanel}\\n${nativePreview}\\n${selection}\\n${turnContext}\\n${verificationController}`;", "const productionSource = `${entry}\\n${app}\\n${approval}\\n${diagnostics}\\n${evidencePanel}\\n${browserEvidencePanel}\\n${browserEvidenceStore}\\n${nativePreview}\\n${selection}\\n${turnContext}\\n${verificationController}`;", 'source contract browser production source')
          trigger_check = "if (!releaseWorkflow.includes(\"apps/desktop/package.json\") || releaseWorkflow.includes(\"apps/desktop/**\")) throw new Error('Intel release must be triggered by deliberate version/release files, not every feature merge');\n"
          text = replace_once(text, "if (!releaseWorkflow.includes('failed_stage')) throw new Error('Intel release failure marker must identify the failed stage');\n", "if (!releaseWorkflow.includes('failed_stage')) throw new Error('Intel release failure marker must identify the failed stage');\n" + trigger_check, 'selective release source contract')
          browser_checks = '''for (const token of ['BROWSER_EVIDENCE_SCRIPT', 'MAX_CONSOLE_EVENTS', 'MAX_RUNTIME_EVENTS', 'MAX_NETWORK_EVENTS', 'SLOW_REQUEST_MS', 'url.pathname', 'unhandledrejection']) {
  if (!browserEvidenceRuntime.includes(token)) throw new Error(`Browser evidence runtime missing ${token}`);
}
if (browserEvidenceRuntime.includes('url.search') || browserEvidenceRuntime.includes('url.hash') || browserEvidenceRuntime.includes('response.text') || browserEvidenceRuntime.includes('response.json')) throw new Error('Browser evidence must not capture query/hash/response bodies');
for (const token of ['captureBrowserEvidence', 'markBrowserEvidenceStale', 'capturedForTurnSerial', 'preview_collect_browser_evidence']) {
  if (!browserEvidenceStore.includes(token)) throw new Error(`Browser evidence store missing ${token}`);
}
for (const token of ['Browser evidence', 'Request headers, request/response bodies, query strings and URL fragments are intentionally not captured.', 'Previous capture is stale']) {
  if (!browserEvidencePanel.includes(token)) throw new Error(`Browser evidence UX missing ${token}`);
}
for (const token of ['turnSerial', "case 'turn/started'", 'turnSerial: this.snapshot.turnSerial + 1']) {
  if (!codexProjection.includes(token)) throw new Error(`Turn-generation stale evidence signal missing ${token}`);
}
for (const token of ['BrowserEvidencePanel', 'browserEvidenceStale', 'deterministicEvidenceStale', 'clearBrowserEvidenceBuffer', 'captureBrowserEvidence']) {
  if (!app.includes(token)) throw new Error(`Browser/stale evidence orchestration missing ${token}`);
}
'''
          text = replace_once(text, "for (const source of [codex, processRuntime, previewRuntime, sourceLocator, verificationRuntime, systemRuntime]) {", browser_checks + "for (const source of [codex, processRuntime, previewRuntime, sourceLocator, verificationRuntime, systemRuntime]) {", 'browser evidence source contract checks')
          text = text.replace('production/native/protocol/auth/select/evidence/auto-QA/trust contract', 'production/native/protocol/auth/select/evidence/browser/stale/release contract')
          write('scripts/check_native_source.mjs', text)
          PY

      - name: Validate web/source contracts before committing
        working-directory: apps/desktop
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run build

      - name: Commit integrated browser evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop .github/workflows/monument-intel-alpha-release.yml
          git commit -m 'feat: wire browser evidence and stale verification'
          git push origin HEAD:monument/browser-evidence
