name: Monument Release Immutability Bootstrap

on:
  push:
    branches: [monument/browser-evidence]
    paths:
      - '.github/workflows/monument-release-immutability-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: monument/browser-evidence
          fetch-depth: 0

      - name: Wait for alpha4 release checkpoint
        run: |
          for attempt in $(seq 1 24); do
            git fetch origin monument/browser-evidence
            git reset --hard origin/monument/browser-evidence
            if grep -q "MONUMENT_VERSION: '0.2.0-alpha.4'" .github/workflows/monument-intel-alpha-release.yml \
              && ! grep -q "'apps/desktop/\*\*'" .github/workflows/monument-intel-alpha-release.yml; then
              exit 0
            fi
            sleep 10
          done
          echo 'alpha4 release workflow checkpoint did not land in time' >&2
          exit 1

      - name: Add immutable tag guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/monument-intel-alpha-release.yml')
          text = path.read_text()
          anchor = '''      - name: Validate production contracts
        run: |
          echo validate > /tmp/monument-release-stage
'''
          guard = '''      - name: Guard immutable release identity
        run: |
          echo identity > /tmp/monument-release-stage
          git fetch --tags --force
          if git rev-parse "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            EXISTING_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "Release tag $RELEASE_TAG already points to $EXISTING_SHA; current commit is $GITHUB_SHA. Bump Monument version instead of replacing an existing release." >&2
              exit 1
            fi
          fi

'''
          if 'Guard immutable release identity' not in text:
              if anchor not in text:
                  raise SystemExit('release validation anchor missing')
              text = text.replace(anchor, guard + anchor, 1)
          path.write_text(text)
          PY

      - name: Commit immutable release guard and remove bootstrap
        run: |
          git rm -f .github/workflows/monument-release-immutability-bootstrap.yml
          git add .github/workflows/monument-intel-alpha-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: enforce immutable Monument release tags'
          git push origin HEAD:monument/browser-evidence
