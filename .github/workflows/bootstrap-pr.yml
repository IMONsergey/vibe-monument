name: Materialize VibeOS release via PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'vibeos-release-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vibeos-release-bootstrap
          fetch-depth: 0

      - name: Verify and extract exact release payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* | base64 -d > /tmp/vibeos.tar.xz
          echo '82b7f50357226bc602db9a347b8f7d5187e955db0821cde27e24207ab2693a7f  /tmp/vibeos.tar.xz' | sha256sum -c -
          tar -xJf /tmp/vibeos.tar.xz
          rm -rf .bootstrap
          # GitHub Actions' token cannot self-modify workflow files. Keep the
          # temporary bootstrap workflows unchanged and add the final CI file
          # afterward through the GitHub connector.
          rm -f .github/workflows/ci.yml

      - name: Commit Codex-native release tree excluding workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materialize Codex-native VibeOS 2 tree'
          git push origin HEAD:vibeos-release-bootstrap
