name: Monument Browser Evidence Default Finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monument-browser-evidence-default-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-browser-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Browser Evidence branch
        run: |
          git fetch origin monument/browser-evidence
          git checkout -B monument-browser-evidence-finalize origin/monument/browser-evidence

      - name: Apply integration, privacy hardening and immutable release guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflows = [
              '.github/workflows/monument-browser-evidence-bootstrap.yml',
              '.github/workflows/monument-browser-evidence-harden.yml',
              '.github/workflows/monument-release-immutability-bootstrap.yml',
          ]

          for workflow in workflows:
              text = Path(workflow).read_text()
              match = re.search(r"python3 - <<'PY'\n(.*?)\n\s+PY(?:\n|$)", text, re.S)
              if not match:
                  raise SystemExit(f'embedded Python block not found in {workflow}')
              code = textwrap.dedent(match.group(1))
              print(f'Applying {workflow}')
              exec(compile(code, workflow, 'exec'), {'__name__': '__main__'})
          PY

      - name: Remove all one-shot Browser Evidence workflows from feature branch
        run: |
          rm -f \
            .github/workflows/monument-browser-evidence-bootstrap.yml \
            .github/workflows/monument-browser-evidence-harden.yml \
            .github/workflows/monument-browser-evidence-cleanup.yml \
            .github/workflows/monument-release-immutability-bootstrap.yml \
            .github/workflows/monument-browser-evidence-finalize.yml

      - name: Push finalized Browser Evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: finalize browser evidence and release integrity'
          git push origin HEAD:monument/browser-evidence

      - name: Remove this one-shot finalizer from main
        if: success()
        run: |
          git fetch origin main
          git checkout -B monument-finalizer-cleanup origin/main
          git rm -f .github/workflows/monument-browser-evidence-default-finalize.yml
          git commit -m 'chore: remove Browser Evidence default finalizer'
          git push origin HEAD:main
