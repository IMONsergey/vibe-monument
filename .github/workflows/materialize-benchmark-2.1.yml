name: Materialize VibeOS 2.1 benchmark release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'vibeos-benchmark-2.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vibeos-benchmark-2.1
          fetch-depth: 0

      - name: Verify and extract exact VibeOS 2.1 tree
        shell: bash
        run: |
          set -euo pipefail
          cat .benchmark-bootstrap/vibeos21.part* | base64 -d > /tmp/vibeos21.tar.xz
          echo '5da7b5e6a0d1f9e2aafce065b8a44d5a97891f4e48abcca81f6d72ab83b2b193  /tmp/vibeos21.tar.xz' | sha256sum -c -
          tar -xJf /tmp/vibeos21.tar.xz
          rm -rf .benchmark-bootstrap

      - name: Commit VibeOS 2.1 tree to benchmark branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materialize Codex benchmark program'
          git push origin HEAD:vibeos-benchmark-2.1
